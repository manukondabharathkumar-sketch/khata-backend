# Server
server.port=8080

# Firebase service account JSON path
# In production on Render.com, use an environment variable:
# firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH}
firebase.service-account-path=src/main/resources/firebase-service-account.json

# Logging
logging.level.com.dukan=DEBUG
logging.level.org.springframework.security=INFO
